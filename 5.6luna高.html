<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车 SVG 动画</title>

  <style>
    :root {
      --speed: 1;
      --ink: #243040;
      --orange: #f28b32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #d9f5ff, #fff2d5);
    }

    .card {
      width: min(980px, 100%);
      padding: clamp(14px, 3vw, 28px);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 24px 70px rgba(38, 83, 108, .18);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 5px;
      font-size: clamp(1.25rem, 3vw, 2rem);
      letter-spacing: .04em;
    }

    .hint {
      margin: 0 0 16px;
      color: #657284;
      font-size: .95rem;
    }

    .scene {
      overflow: hidden;
      border-radius: 20px;
      background: #9fe6f5;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      margin-top: 15px;
    }

    button,
    select {
      border: 0;
      border-radius: 999px;
      padding: 9px 15px;
      color: white;
      background: #315c76;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      background: #24465b;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #526273;
      font-size: .92rem;
    }

    #speed {
      accent-color: var(--orange);
    }

    .rider {
      animation:
        ride-bob calc(1.2s / var(--speed))
        ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation:
        spin calc(.82s / var(--speed))
        linear infinite;
    }

    .pedal-arm {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation:
        spin calc(1.25s / var(--speed))
        linear infinite reverse;
    }

    .leg-a {
      transform-box: fill-box;
      transform-origin: 0 0;
      animation:
        leg-a calc(1.25s / var(--speed))
        ease-in-out infinite;
    }

    .leg-b {
      transform-box: fill-box;
      transform-origin: 0 0;
      animation:
        leg-b calc(1.25s / var(--speed))
        ease-in-out infinite;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 20% 75%;
      animation:
        wing-flap calc(1.2s / var(--speed))
        ease-in-out infinite;
    }

    .head {
      transform-box: fill-box;
      transform-origin: 55% 85%;
      animation:
        head-bob calc(1.2s / var(--speed))
        ease-in-out infinite;
    }

    .cloud {
      animation: cloud-drift 24s linear infinite;
    }

    .cloud.slow {
      animation-duration: 38s;
      animation-delay: -13s;
    }

    .road-mark {
      animation:
        road-move calc(2.6s / var(--speed))
        linear infinite;
    }

    .water-line {
      animation:
        water-move calc(5s / var(--speed))
        linear infinite;
    }

    .paused * {
      animation-play-state: paused !important;
    }

    @keyframes ride-bob {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes leg-a {
      0%, 100% {
        transform: rotate(18deg);
      }

      50% {
        transform: rotate(-32deg);
      }
    }

    @keyframes leg-b {
      0%, 100% {
        transform: rotate(-32deg);
      }

      50% {
        transform: rotate(18deg);
      }
    }

    @keyframes wing-flap {
      0%, 100% {
        transform: rotate(2deg);
      }

      50% {
        transform: rotate(-13deg);
      }
    }

    @keyframes head-bob {
      0%, 100% {
        transform: rotate(1deg);
      }

      50% {
        transform: rotate(-3deg);
      }
    }

    @keyframes cloud-drift {
      from {
        transform: translateX(-55px);
      }

      to {
        transform: translateX(55px);
      }
    }

    @keyframes road-move {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-180px);
      }
    }

    @keyframes water-move {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-100px);
      }
    }
  </style>
</head>

<body>

    <!-- 控制区域 -->
    <div class="controls" aria-label="动画控制">
      <button id="toggle" type="button">
        暂停动画
      </button>

      <label>
        速度

        <select id="speed" aria-label="选择动画速度">
          <option value="0.65">慢速</option>
          <option value="1" selected>正常</option>
          <option value="1.5">快速</option>
          <option value="2.2">超快</option>
        </select>
      </label>

      <span
        id="status"
        aria-live="polite"
        style="color:#657284;font-size:.9rem"
      >
        正在骑行中
      </span>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const card = document.querySelector(".card");
    const toggle = document.querySelector("#toggle");
    const speed = document.querySelector("#speed");
    const status = document.querySelector("#status");

    toggle.addEventListener("click", () => {
      const paused = card.classList.toggle("paused");

      toggle.textContent = paused
        ? "继续动画"
        : "暂停动画";

      status.textContent = paused
        ? "动画已暂停"
        : "正在骑行中";
    });

    speed.addEventListener("change", () => {
      root.style.setProperty("--speed", speed.value);
    });
  </script>
</body>
</html>
