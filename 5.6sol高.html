<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="完全由 SVG 绘制的鹈鹕骑自行车 2D 动画" />
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>

  <style>
    :root {
      --speed: 1;
      --ink: #203044;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(
          circle at 18% 12%,
          rgba(255, 255, 255, 0.9),
          transparent 26%
        ),
        linear-gradient(145deg, #c7f0ff, #78caff 52%, #b7f0df);
    }

    .card {
      width: min(1120px, 100%);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 26px 70px rgba(35, 84, 120, 0.26);
      backdrop-filter: blur(14px);
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: 0.04em;
    }

    .badge {
      flex: 0 0 auto;
      padding: 7px 12px;
      border-radius: 999px;
      color: white;
      font-size: 13px;
      font-weight: 700;
      background: #203044;
    }

    .stage-wrap {
      position: relative;
      margin: 0 18px;
      overflow: hidden;
      border-radius: 22px;
      box-shadow: inset 0 0 0 1px rgba(25, 55, 82, 0.1);
      background: #8cd7ff;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 18px 20px;
    }

    button {
      min-width: 110px;
      padding: 11px 16px;
      border: 0;
      border-radius: 13px;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: #203044;
      box-shadow: 0 6px 14px rgba(32, 48, 68, 0.2);
      transition:
        transform 0.16s ease,
        background 0.16s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #304b69;
    }

    button:active {
      transform: translateY(0);
    }

    button.active {
      background: #e64c47;
    }

    .hint {
      flex-basis: 100%;
      margin: 2px 0 0;
      color: #5f7184;
      text-align: center;
      font-size: 13px;
    }

    /* 背景移动动画 */

    .clouds {
      animation: drift calc(34s / var(--speed)) linear infinite;
    }

    .far-hills {
      animation: drift calc(22s / var(--speed)) linear infinite;
    }

    .near-scenery {
      animation: drift calc(8s / var(--speed)) linear infinite;
    }

    .road-lines {
      animation: drift calc(2.6s / var(--speed)) linear infinite;
    }

    /* 自行车动画 */

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin calc(1.15s / var(--speed)) linear infinite;
    }

    .crank {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin calc(1.15s / var(--speed)) linear infinite;
    }

    /* 鹈鹕动画 */

    .rider {
      animation: bob calc(0.58s / var(--speed)) ease-in-out infinite alternate;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 18% 25%;
      animation: wing calc(1.1s / var(--speed)) ease-in-out infinite alternate;
    }

    .head-feather {
      transform-box: fill-box;
      transform-origin: 20% 70%;
      animation: feather calc(0.42s / var(--speed)) ease-in-out infinite alternate;
    }

    .scarf-tail {
      transform-box: fill-box;
      transform-origin: left center;
      animation: scarf calc(0.32s / var(--speed)) ease-in-out infinite alternate;
    }

    .front-leg {
      transform-box: fill-box;
      transform-origin: 50% 4%;
      animation: leg-front calc(1.15s / var(--speed)) linear infinite;
    }

    .back-leg {
      transform-box: fill-box;
      transform-origin: 50% 4%;
      animation: leg-back calc(1.15s / var(--speed)) linear infinite;
    }

    .shadow {
      transform-origin: center;
      animation: shadow calc(0.58s / var(--speed)) ease-in-out infinite alternate;
    }

    .sun-rays {
      transform-origin: 148px 108px;
      animation: spin 16s linear infinite;
    }

    @keyframes drift {
      to {
        transform: translateX(-800px);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bob {
      to {
        transform: translateY(-6px) rotate(-0.4deg);
      }
    }

    @keyframes wing {
      to {
        transform: rotate(-7deg);
      }
    }

    @keyframes feather {
      to {
        transform: rotate(-10deg);
      }
    }

    @keyframes scarf {
      to {
        transform: rotate(8deg) scaleX(0.92);
      }
    }

    @keyframes leg-front {
      0% {
        transform: rotate(14deg);
      }

      25% {
        transform: rotate(-14deg);
      }

      50% {
        transform: rotate(-30deg);
      }

      75% {
        transform: rotate(-4deg);
      }

      100% {
        transform: rotate(14deg);
      }
    }

    @keyframes leg-back {
      0% {
        transform: rotate(-30deg);
      }

      25% {
        transform: rotate(-4deg);
      }

      50% {
        transform: rotate(14deg);
      }

      75% {
        transform: rotate(-14deg);
      }

      100% {
        transform: rotate(-30deg);
      }
    }

    @keyframes shadow {
      to {
        transform: scaleX(0.92);
        opacity: 0.18;
      }
    }

    .paused,
    .paused * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .scene,
      .scene * {
        animation-play-state: paused !important;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .card {
        border-radius: 20px;
      }

      .heading {
        padding: 15px 16px 10px;
      }

      .stage-wrap {
        margin: 0 10px;
        border-radius: 16px;
      }

      .badge {
        display: none;
      }

      button {
        min-width: 92px;
        padding: 10px 12px;
      }
    }
  </style>
</head>

        暂停动画

      <button id="restart" type="button">
        重新播放
      </button>

      <button class="speed" data-speed="0.65" type="button">
        慢速
      </button>

      <button class="speed active" data-speed="1" type="button">
        正常
      </button>

      <button class="speed" data-speed="1.7" type="button">
        快速
      </button>

      <p class="hint">
        完全离线运行，不需要图片、字体、脚本库或网络连接。
      </p>

  <script>
    let scene = document.getElementById("scene");

    const toggleButton = document.getElementById("toggle");
    const restartButton = document.getElementById("restart");

    const speedButtons = [
      ...document.querySelectorAll(".speed")
    ];

    /*
     * 暂停或者继续动画
     */
    toggleButton.addEventListener("click", function () {
      const paused = scene.classList.toggle("paused");

      toggleButton.textContent = paused
        ? "继续动画"
        : "暂停动画";

      toggleButton.classList.toggle("active", paused);
    });

    /*
     * 重新播放动画
     */
    restartButton.addEventListener("click", function () {
      const wasPaused = scene.classList.contains("paused");

      const newScene = scene.cloneNode(true);

      scene.replaceWith(newScene);

      scene = newScene;

      if (wasPaused) {
        scene.classList.remove("paused");

        toggleButton.textContent = "暂停动画";

        toggleButton.classList.remove("active");
      }
    });

    /*
     * 修改播放速度
     */
    speedButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        document.documentElement.style.setProperty(
          "--speed",
          button.dataset.speed
        );

        speedButtons.forEach(function (item) {
          item.classList.remove("active");
        });

        button.classList.add("active");
      });
    });
  </script>
