<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑行记</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #dceeed;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 1000px);
      padding: 20px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 24px;
      box-shadow: 0 20px 60px #456c7028;
    }

    /* 车轮旋转 */
    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 1.1s linear infinite;
    }

    /* 脚踏旋转 */
    .pedal {
      transform-origin: 405px 398px;
      animation: spin 1.1s linear infinite;
    }

    /* 鹈鹕身体上下起伏 */
    .rider {
      animation: bob 1.1s ease-in-out infinite;
    }

    /* 云朵移动 */
    .cloud1 {
      animation: drift 12s ease-in-out infinite alternate;
    }

    .cloud2 {
      animation: drift 17s ease-in-out infinite alternate-reverse;
    }

    /* 道路标线移动 */
    .dash {
      animation: road 1s linear infinite;
    }

    /* 翅膀摆动 */
    .wing {
      transform-origin: 389px 269px;
      animation: flap 1.1s ease-in-out infinite alternate;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bob {
      50% {
        transform: translateY(-4px) rotate(-0.5deg);
      }
    }

    @keyframes flap {
      to {
        transform: rotate(-7deg);
      }
    }

    @keyframes drift {
      to {
        transform: translateX(35px);
      }
    }

    @keyframes road {
      to {
        stroke-dashoffset: 100;
      }
    }

    /* 遵循系统的减少动态效果设置 */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <svg
      viewBox="0 0 900 600"
      role="img"
      aria-labelledby="title desc"
      xmlns="http://www.w3.org/2000/svg"
    >
      <title id="title">鹈鹕骑行记</title>
      <desc id="desc">
        一只白色鹈鹕骑着橙色自行车，在海边的道路上快乐前行。
      </desc>

      <defs>
        <!-- 天空渐变 -->
        <linearGradient id="sky" x2="0" y2="1">
          <stop stop-color="#d5eff0"/>
          <stop offset="1" stop-color="#f5f4dc"/>
        </linearGradient>

        <!-- 海水渐变 -->
        <linearGradient id="sea" x2="0" y2="1">
          <stop stop-color="#83c9c3"/>
          <stop offset="1" stop-color="#a9dbcc"/>
        </linearGradient>
      </defs>

      <!-- 天空 -->
      <rect width="900" height="600" fill="url(#sky)"/>

      <!-- 太阳 -->
      <circle cx="750" cy="105" r="44" fill="#f5c96b"/>

      <!-- 左边的云 -->
      <g fill="#fff" opacity=".8" class="cloud1">
        <ellipse cx="170" cy="115" rx="72" ry="16"/>
        <ellipse cx="155" cy="103" rx="28" ry="22"/>
        <ellipse cx="194" cy="106" rx="34" ry="19"/>
      </g>

      <!-- 右边的云 -->
      <g fill="#fff" opacity=".65" class="cloud2">
        <ellipse cx="572" cy="80" rx="55" ry="12"/>
        <ellipse cx="558" cy="70" rx="22" ry="18"/>
        <ellipse cx="588" cy="73" rx="26" ry="15"/>
      </g>

      <!-- 大海 -->
      <path
        d="M0 315 Q115 288 220 315 T440 314 T660 310 T900 308 V600 H0Z"
        fill="url(#sea)"
      />

      <!-- 海面波纹 -->
      <g
        fill="none"
        stroke="#e8faf2"
        stroke-width="3"
        stroke-linecap="round"
        opacity=".7"
      >
        <path d="M80 348h65m13 0h18M700 350h76m15 0h20M550 375h45M245 360h45"/>
      </g>

      <!-- 沙滩 -->
      <path
        d="M0 430 Q150 414 300 425 T600 426 T900 420 V600 H0Z"
        fill="#e6d9b4"
      />

      <!-- 道路 -->
      <path
        d="M0 495 Q300 476 600 490 T900 488 V600 H0Z"
        fill="#76938a"
      />

      <!-- 移动的道路标线 -->
      <path
        class="dash"
        d="M-100 555 H1000"
        fill="none"
        stroke="#e2e6c9"
        stroke-width="5"
        stroke-dasharray="56 44"
        stroke-linecap="round"
      />

      <!-- 自行车下方的阴影 -->
      <ellipse
        cx="440"
        cy="499"
        rx="250"
        ry="13"
        fill="#56736c"
        opacity=".18"
      />

      <!-- 自行车轮胎 -->
      <g fill="none" stroke="#344e50" stroke-width="11">
        <circle cx="263" cy="421" r="78"/>
        <circle cx="601" cy="421" r="78"/>
      </g>

      <!-- 后轮辐条 -->
      <g
        class="wheel"
        fill="none"
        stroke="#f8f2de"
        stroke-width="3"
      >
        <circle cx="263" cy="421" r="69"/>
        <path d="M194 421h138M263 352v138M214 372l98 98m0-98-98 98"/>
      </g>

      <!-- 前轮辐条 -->
      <g
        class="wheel"
        fill="none"
        stroke="#f8f2de"
        stroke-width="3"
      >
        <circle cx="601" cy="421" r="69"/>
        <path d="M532 421h138M601 352v138M552 372l98 98m0-98-98 98"/>
      </g>

      <!-- 自行车车架 -->
      <g
        fill="none"
        stroke="#dc7954"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M263 421l111-117 31 94-142 23 97-91h173l-128 68M533 330l68 91M523 302l10 28"/>
      </g>

      <!-- 车把 -->
      <path
        d="M512 302h44q12 0 12-12"
        fill="none"
        stroke="#344e50"
        stroke-width="8"
        stroke-linecap="round"
      />

      <!-- 车座 -->
      <path
        d="M350 301h50"
        stroke="#344e50"
        stroke-width="9"
        stroke-linecap="round"
      />

      <!-- 链轮 -->
      <circle
        cx="405"
        cy="398"
        r="19"
        fill="#f4deae"
        stroke="#344e50"
        stroke-width="4"
      />

      <!-- 脚踏板 -->
      <g
        class="pedal"
        stroke="#344e50"
        stroke-width="6"
        stroke-linecap="round"
      >
        <path d="M405 398l18 21m-36-42 18 21"/>
        <path d="M416 420h18m-57-44h18"/>
      </g>

      <!-- 轮轴 -->
      <circle cx="263" cy="421" r="6" fill="#344e50"/>
      <circle cx="601" cy="421" r="6" fill="#344e50"/>

      <!-- 鹈鹕 -->
      <g class="rider">
        <!-- 后腿 -->
        <path
          d="M385 291q13 26 30 42l-15 45"
          fill="none"
          stroke="#d8985e"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M400 378l-15 4m15-4 13 4"
          fill="none"
          stroke="#d8985e"
          stroke-width="6"
          stroke-linecap="round"
        />

        <!-- 前腿 -->
        <path
          d="M377 295q-27 22-17 59l30 24"
          fill="none"
          stroke="#e7a66a"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M389 378l-13 4m13-4 13 4"
          fill="none"
          stroke="#e7a66a"
          stroke-width="6"
          stroke-linecap="round"
        />

        <!-- 尾巴 -->
        <path
          d="M322 271q-27 1-42-18 5 35 44 37"
          fill="#e4e8dc"
        />

        <!-- 身体 -->
        <path
          d="M313 267q10-54 83-53 62 0 82 38 11 22-7 47-23 31-86 32-65 0-73-38-3-13 1-26Z"
          fill="#fffdf2"
          stroke="#d9e2d8"
          stroke-width="3"
        />

        <!-- 脖子和头 -->
        <path
          d="M434 256q33-7 35-42l-5-49q-2-33 31-39 34-6 43 23 6 20-5 38-9 15-16 36-12 46-42 64"
          fill="#fffdf2"
          stroke="#d9e2d8"
          stroke-width="3"
        />

        <!-- 喉囊 -->
        <path
          d="M525 169q30 8 87 22-21 24-55 20-24-3-37-24Z"
          fill="#efb96d"
          stroke="#d99a58"
          stroke-width="2"
        />

        <!-- 长嘴 -->
        <path
          d="M524 164q42 2 105 21-45 7-106 1Z"
          fill="#eea75f"
          stroke="#d99250"
          stroke-width="2"
          stroke-linejoin="round"
        />

        <!-- 眼睛 -->
        <circle cx="510" cy="151" r="4.5" fill="#344e50"/>
        <circle cx="511" cy="149.5" r="1.2" fill="#fff"/>

        <!-- 翅膀 -->
        <path
          class="wing"
          d="M337 264q30-26 85-15 21 4 31 17-17 31-58 38-36 6-58-14 28 5 45-7-28 4-45-19Z"
          fill="#e9eee6"
          stroke="#d7e1d9"
          stroke-width="2"
        />

        <!-- 伸向车把的翅膀 -->
        <path
          d="M453 271q38 7 70 30"
          fill="none"
          stroke="#e5ebe2"
          stroke-width="9"
          stroke-linecap="round"
        />
      </g>

      <!-- 画面文字 -->
      <g fill="#fffdf4" font-family="system-ui, sans-serif">
        <text
          x="52"
          y="67"
          font-size="14"
          letter-spacing="4"
          font-weight="700"
        >
          A LITTLE SEASIDE RIDE
        </text>

        <text
          x="52"
          y="102"
          font-size="25"
          font-weight="700"
        >
          鹈鹕的海边骑行
        </text>
      </g>

      <!-- 路边的草 -->
      <g fill="#759a88" opacity=".8">
        <path d="M95 492q5-26 9-30 2 18 0 30M117 490q8-21 13-23-1 14-5 23M777 489q4-26 9-31 4 17 1 31M805 490q6-18 11-20-1 13-4 20"/>
      </g>
    </svg>
  </main>
</body>
</html>
