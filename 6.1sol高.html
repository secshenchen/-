<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
:root {
  color-scheme: light;
  --ink: #243d44;
  --muted: #72868a;
  --accent: #ec7652;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f5ed;
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 30px 18px;
}

main {
  width: min(1040px, 100%);
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 0 4px 22px;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--muted);
  margin: 0 0 9px;
}

h1 {
  font-size: clamp(24px, 4vw, 38px);
  letter-spacing: -.04em;
  margin: 0;
  font-weight: 750;
}

header span {
  font-size: 12px;
  white-space: nowrap;
  border: 1px solid #d7ded5;
  border-radius: 30px;
  padding: 9px 13px;
}

.canvas {
  overflow: hidden;
  border-radius: 26px;
  border: 1px solid #dae4db;
  background: #deeee8;
  box-shadow: 0 20px 70px #39564b10;
}

svg {
  display: block;
  width: 100%;
  height: auto;
}

.controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 20px 24px;
  background: #fffdf6;
  border-top: 1px solid #dce4d9;
}

button {
  font: inherit;
  font-size: 13px;
  border: 1px solid #d9ded5;
  border-radius: 12px;
  background: white;
  color: var(--ink);
  padding: 11px 17px;
  cursor: pointer;
}

button.primary {
  background: var(--ink);
  border-color: var(--ink);
  color: white;
}

button:hover {
  filter: brightness(.95);
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid #edac65;
  outline-offset: 3px;
}

.speed {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
}

.speed input {
  width: 130px;
  accent-color: var(--accent);
}

output {
  font-variant-numeric: tabular-nums;
  min-width: 40px;
  font-size: 12px;
}

.note {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 17px;
  line-height: 1.7;
}

@media (max-width: 560px) {
  body {
    padding: 24px 12px;
  }

  header span {
    display: none;
  }

  .controls {
    padding: 15px;
    gap: 8px;
  }

  .speed {
    margin-left: 0;
    width: 100%;
    padding-top: 7px;
  }

  .speed input {
    flex: 1;
  }

  .canvas {
    border-radius: 18px;
  }
}
</style>
</head>

<body>
<main>
  <header>
    <div>
      <p class="eyebrow">A LITTLE RIDE BY THE SEA</p>
      <h1>鹈鹕的海边骑行</h1>
    </div>
    <span>SVG · 2D 动画</span>
  </header>

  <section class="canvas" aria-label="鹈鹕骑自行车的动画与控制">
    <svg
      id="scene"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1000 620"
      role="img"
      aria-labelledby="sceneTitle sceneDesc"
    >
      <title id="sceneTitle">一只鹈鹕在海边骑自行车</title>
      <desc id="sceneDesc">
        白色鹈鹕戴着绿色头盔，骑着珊瑚色自行车。
        双腿跟随脚踏转动，车轮旋转，海边景物不断向后移动。
      </desc>

      <defs>
        <linearGradient id="sky" x2="0" y2="1">
          <stop stop-color="#d7eae4"/>
          <stop offset="1" stop-color="#f1f4dd"/>
        </linearGradient>

        <linearGradient id="sea" x2="0" y2="1">
          <stop stop-color="#91c5bd"/>
          <stop offset="1" stop-color="#bedbd0"/>
        </linearGradient>

        <linearGradient id="pouch" x2="0" y2="1">
          <stop stop-color="#ffc577"/>
          <stop offset="1" stop-color="#ef9954"/>
        </linearGradient>

        <pattern
          id="road"
          width="150"
          height="20"
          patternUnits="userSpaceOnUse"
        >
          <path
            d="M22 10h62"
            stroke="#fff8e6"
            stroke-width="5"
            stroke-linecap="round"
          />
        </pattern>

        <g id="cloudShape" fill="#fffdf0">
          <ellipse rx="50" ry="14"/>
          <ellipse cx="-17" cy="-11" rx="24" ry="20"/>
          <ellipse cx="15" cy="-16" rx="28" ry="26"/>
        </g>

        <g id="plant">
          <path
            d="M0 0q-14-24-7-43M0 0q18-23 13-33M0 0q-3-19 5-51"

          <ellipse
            cx="-9"

      <!-- 天空与太阳 -->

      <!-- 远景 -->

      <!-- 沙滩与道路 -->

      <g id="rider">

        <!-- 自行车车架 -->
        <g

        />

        <path
          d="M604 266h24"

          stroke-linecap="round"
        />

        <!-- 挡泥板 -->
        <path
          d="M330 350q-35 7-49 43M623 349q37 0 66 34"

          stroke-width="5"
          fill="none"
          stroke-linecap="round"
        />

        <!-- 齿盘与轮轴 -->
        <circle
          cx="477"
          cy="429"
          r="23"
          fill="#d9e4d6"
          stroke="#36575a"
          stroke-width="4"
        />
        <circle cx="348" cy="429" r="7" fill="#36575a"/>
        <circle cx="634" cy="429" r="7" fill="#36575a"/>

        <!-- 链条 -->
        <path
          d="M348 419L477 407M348 439L477 451"
          stroke="#526e69"
          stroke-width="3"
        />

        <!-- 曲柄 -->
        <g id="crank">
          <path
            d="M-30 0h60"

            stroke-width="6"
            stroke-linecap="round"

          <circle r="6" fill="#36575a"/>
        </g>

        <!-- 脚踏 -->

          <rect
            x="-15"

        <g id="farPedal">
          <rect
            x="-15"
            y="4"
            width="32"
            height="8"
            rx="3"
            fill="#526e69"
          />
        </g>

        <!-- 鹈鹕尾巴 -->
        <path
          d="M386 243l-70-13 25 27-18 4 65 17z"
          fill="#f8f6e9"
          stroke="#cbd5c9"

        <!-- 身体 -->
        <path

          fill="#fffdf0"
          stroke="#cbd5c9"
          stroke-width="3"
        />

        <!-- 脖子与头 -->
        <path
          d="M459 240C499 225 501 206 493 177C485 149 490 126 518 120C545 114 563 130 559 151C555 170 535 178 532 192Q534 228 505 262"
          fill="#fffdf0"
          stroke="#cbd5c9"
          stroke-width="3"
        />

        <path
          d="M500 177q-2 30 12 41"
          stroke="#e2e6d6"
          stroke-width="8"
          fill="none"
          stroke-linecap="round"
        />

        <!-- 鹈鹕的大喉囊 -->
        <path
          d="M549 151L690 163Q640 221 592 202Q563 192 549 160z"
          fill="url(#pouch)"
          stroke="#db9c54"
          stroke-width="3"
        />

        <!-- 长嘴 -->
        <path
          d="M550 144Q614 145 708 163L690 172 550 158z"

          stroke="#d6974e"

        <path
          d="M564 158l125 6"

        <!-- 眼睛 -->
        <circle cx="542" cy="136" r="6" fill="#243d44"/>
        <circle cx="544" cy="134" r="2" fill="#fff"/>

        <!-- 头盔 -->
        <path
          d="M492 126q-2-37 33-41 34-2 40 32l-3 8z"

          stroke="#32695f"

        />

        <path
          d="M519 92q-11 8-12 22M541 93q-9 9-9 21"
          stroke="#8fbeb0"
          stroke-width="5"
          stroke-linecap="round"
        />

        <path
          d="M491 125h76"
          stroke="#32695f"
          stroke-width="5"
          stroke-linecap="round"
        />

        <path
          d="M502 127l8 30 18-2"
          fill="none"
          stroke="#648e7d"
          stroke-width="3"
        />

        <!-- 围巾 -->
        <path
          id="scarf"
          d="M492 199Q456 194 433 181L444 199 427 207Q465 210 495 209"

        />

        <path
          d="M489 196l13 8-9 12-12-10z"

        <!-- 翅膀伸向车把 -->
        <path

        />

          fill="none"
          stroke="#cdd8ca"
          stroke-width="3"
          stroke-linecap="round"
        />

        <!-- 近侧腿 -->
        <path
          id="nearLeg"

          fill="none"

        />

        <!-- 近侧脚 -->
        <g id="nearFoot">
          <path
            d="M-14-3Q-5-12 5-6L27 0Q29 7 19 8H-15z"
            fill="#f2b760"
            stroke="#d49746"
            stroke-width="2"
          />
          <path
            d="M3-4l8 8M13-2l5 7"
            stroke="#d49746"

          />
        </g>

        <circle cx="439" cy="287" r="9" fill="#fffdf0"/>
      </g>

      <!-- 远处飞鸟 -->
      <g fill="#668c7c" opacity=".75">
        <path
          d="M76 65q8-9 17 0 9-9 17 0"
          fill="none"
          stroke="#668c7c"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path
          d="M119 87q6-7 13 0 6-7 13 0"
          fill="none"
          stroke="#668c7c"
          stroke-width="2"
          stroke-linecap="round"
        />
      </g>

      <text
        x="40"
        y="586"
        fill="#5f7770"
        font-size="11"
        font-family="system-ui,sans-serif"
        letter-spacing="3"
      >海风正好，慢慢骑。</text>
    </svg>

    <div class="controls">
      <button
        id="toggle"
        class="primary"
        type="button"
        aria-pressed="false"
      >暂停动画</button>

      <button id="direction" type="button">方向：向右 →</button>
      <button id="reset" type="button">重新开始</button>

      <label class="speed" for="speed">
        骑行速度
        <input
          id="speed"
          type="range"
          min="0.25"
          max="2.5"
          step="0.05"
          value="1"
        >
        <output id="speedValue" for="speed">1.00×</output>
      </label>
    </div>
  </section>

  <p class="note">
    全部画面由 SVG 绘制 · 单个 HTML 文件 · 无需联网<br>
    空格键暂停 / 继续，左右方向键切换骑行方向
  </p>
</main>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const ns = 'http://www.w3.org/2000/svg';

  const state = {
    playing: !matchMedia('(prefers-reduced-motion: reduce)').matches,
    speed: 1,
    direction: 1,
    time: 0
  };

  // 创建 SVG 线段。
  function line(parent, x1, y1, x2, y2) {
    const el = document.createElementNS(ns, 'line');

    for (const [key, val] of Object.entries({
      x1,
      y1,
      x2,
      y2
    })) {
      el.setAttribute(key, val);
    }

    parent.append(el);
  }

  // 绘制两个车轮的辐条。
  for (const [id, cx] of [
    ['rearSpokes', 348],
    ['frontSpokes', 634]
  ]) {
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;

      line(
        $(id),
        cx,
        429,
        cx + 68 * Math.cos(a),
        429 + 68 * Math.sin(a)
      );
    }
  }

  // 绘制海面波纹。
  for (let i = 0; i < 16; i++) {
    const w = document.createElementNS(ns, 'path');

    w.setAttribute(
      'd',
      `M${i * 88} ${335 + (i % 3) * 21}h${24 + (i % 4) * 9}`
    );

    $('waves').append(w);
  }

  // 创建道路两侧的植物。
  for (let i = 0; i < 8; i++) {
    const g = document.createElementNS(ns, 'g');

    g.dataset.x = i * 175;

    const plant = document.createElementNS(ns, 'use');
    plant.setAttribute('href', '#plant');
    plant.setAttribute('transform', 'scale(.8)');

    g.append(plant);
    $('scenery').append(g);
  }

  // 根据脚踏位置计算膝盖位置，让脚始终跟随脚踏。
  function leg(pathId, footId, pedalId, hip, angle) {
    const foot = {
      x: 477 + 30 * Math.cos(angle),
      y: 429 + 30 * Math.sin(angle)
    };

    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const d = Math.hypot(dx, dy);

    const upper = 91;
    const lower = 91;

    const along = (
      upper * upper - lower * lower + d * d
    ) / (2 * d);

    const height = Math.sqrt(
      Math.max(0, upper * upper - along * along)
    );

    const knee = {
      x: hip.x + dx / d * along + dy / d * height,
      y: hip.y + dy / d * along - dx / d * height
    };

    $(pathId).setAttribute(
      'd',
      `M${hip.x} ${hip.y}` +
      `L${knee.x} ${knee.y}` +
      `L${foot.x} ${foot.y}`
    );

    $(footId).setAttribute(
      'transform',
      `translate(${foot.x} ${foot.y - 4})`
    );

    $(pedalId).setAttribute(
      'transform',
      `translate(${foot.x} ${foot.y})`
    );
  }

  const wrap = (n, m) => ((n % m) + m) % m;

  // 更新每一帧的 SVG 图形。
  function render() {
    const t = state.time;
    const a = t * 3.6;
    const bob = Math.sin(a * 2) * 1.5;

    // 向左骑行时镜像整个角色与自行车。
    $('rider').setAttribute(
      'transform',
      state.direction === 1
        ? `translate(0 ${bob})`
        : `translate(1000 ${bob}) scale(-1 1)`
    );

    // 车轮转速与脚踏转速保持对应。
    const wheel = t * 3.6 * 30 / 77 * 180 / Math.PI;

    $('rearSpokes').setAttribute(
      'transform',
      `rotate(${wheel} 348 429)`
    );

    $('frontSpokes').setAttribute(
      'transform',
      `rotate(${wheel} 634 429)`
    );

    $('crank').setAttribute(
      'transform',
      `translate(477 429) rotate(${a * 180 / Math.PI})`
    );

    // 两个脚踏相差半圈。
    leg(
      'nearLeg',
      'nearFoot',
      'nearPedal',
      { x: 439, y: 287 },
      a
    );

    leg(
      'farLeg',
      'farFoot',
      'farPedal',
      { x: 425, y: 285 },
      a + Math.PI
    );

    // 地面反向移动，形成前进效果。
    $('roadDashes').setAttribute(
      'transform',
      `translate(${-wrap(t * 108 * state.direction, 150)} 0)`
    );

    $('waves').setAttribute(
      'transform',
      `translate(${-wrap(t * 13 * state.direction, 88)} 0)`
    );

    // 围巾轻微摆动。
    $('scarf').setAttribute(
      'transform',
      `rotate(${Math.sin(t * 7) * 2} 493 204)`
    );

    // 云朵缓慢移动。
    $('clouds').setAttribute(
      'transform',
      `translate(${Math.sin(t * .055) * 22} 0)`
    );

    // 植物循环经过画面。
    [...$('scenery').children].forEach((g, i) => {
      const x = wrap(
        Number(g.dataset.x) - t * 108 * state.direction + 180,
        1400
      ) - 180;

      const y = i % 2 ? 462 : 608;

      g.setAttribute(
        'transform',
        `translate(${x} ${y})`
      );
    });
  }

  function updateButton() {
    $('toggle').textContent = state.playing
      ? '暂停动画'
      : '继续动画';

    $('toggle').setAttribute(
      'aria-pressed',
      String(!state.playing)
    );
  }

  function toggle() {
    state.playing = !state.playing;
    updateButton();
  }

  function changeDirection(d) {
    state.direction = d;

    $('direction').textContent = d === 1
      ? '方向：向右 →'
      : '方向：向左 ←';

    render();
  }

  $('toggle').addEventListener('click', toggle);

  $('direction').addEventListener('click', () => {
    changeDirection(-state.direction);
  });

  $('reset').addEventListener('click', () => {
    state.time = 0;
    state.speed = 1;
    state.playing = true;

    $('speed').value = '1';
    $('speedValue').value = '1.00×';

    changeDirection(1);
    updateButton();
    render();
  });

  $('speed').addEventListener('input', e => {
    state.speed = Number(e.target.value);
    $('speedValue').value = state.speed.toFixed(2) + '×';
  });

  // 键盘操作。
  document.addEventListener('keydown', e => {
    if ([
      'INPUT',
      'BUTTON',
      'TEXTAREA',
      'SELECT'
    ].includes(e.target.tagName)) {
      return;
    }

    if (e.code === 'Space') {
      e.preventDefault();
      toggle();
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      changeDirection(-1);
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      changeDirection(1);
    }
  });

  let last;

  function frame(now) {
    if (last !== undefined && state.playing) {
      state.time += Math.min(
        (now - last) / 1000,
        .05
      ) * state.speed;
    }

    last = now;

    render();
    requestAnimationFrame(frame);
  }

  // 返回页面时避免时间突然跳跃。
  document.addEventListener('visibilitychange', () => {
    last = undefined;
  });

  updateButton();
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
