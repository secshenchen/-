<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的海岸骑行</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #f6f2e7; color: #23393c; font-family: "Source Sans 3","PingFang SC","Microsoft YaHei",sans-serif }
  main { width: min(100% - 36px, 930px); margin: clamp(20px,5vh,60px) auto }
  header, footer, .controls { display: flex; align-items: center }
  header { justify-content: space-between; gap: 12px; margin-bottom: 17px }
  h1 { font-family: "Source Han Serif SC","Songti SC",serif; font-size: clamp(22px,3.3vw,36px); letter-spacing: .04em; margin: 0 }
  button,select { color: inherit; font: inherit; cursor: pointer }
  button { background: transparent; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px }
  button:focus-visible,select:focus-visible { outline: 3px solid #ac542d; outline-offset: 3px }
  #download { font-size: 14px; padding: 10px 0 10px 10px }
  figure { margin: 0; border: 2px solid #283e3e; border-radius: 10px; overflow: hidden; background: #faf6ec; box-shadow: 3px 4px 0 #ccc9b8 }
  #scene { display: block; width: 100%; height: auto }
  footer { padding: 11px 19px; border-top: 2px solid #283e3e; justify-content: space-between; gap: 12px }
  .controls { gap: 12px }
  #toggle { background: #243d40; color: #fff8e7; border-radius: 99px; min-height: 37px; padding: 0 17px }
  #restart { width: 36px; height: 36px; border: 1px solid #c4c4b6; border-radius: 50% }
  select { background: #faf6ec; border: 1px solid #bcbfae; border-radius: 6px; padding: 6px }
  label { font-size: 14px }
  @media(max-width:500px) { main { width: calc(100% - 20px) } footer { padding: 9px } }
</style>
</head>

<script>
  // 保存初始文档，让下载的文件也可以独立运行。
  const source = '<!doctype html>\n' + document.documentElement.outerHTML;
  const byId = id => document.getElementById(id);
  const scene = byId('scene');
  const ns = 'http://www.w3.org/2000/svg';
  scene.pauseAnimations();

  function addPath(parent, attributes) {
    const path = document.createElementNS(ns, 'path');
    for (const [name, value] of Object.entries(attributes)) path.setAttribute(name, value);
    parent.appendChild(path);
    return path;
  }

  function makeLeg(id, color) {
    const group = byId(id);
    const crank = addPath(group, { fill: 'none', stroke: '#344949', 'stroke-width': 5 });
    const outline = addPath(group, { fill: 'none', stroke: '#453e39', 'stroke-width': 9 });
    const skin = addPath(group, { fill: 'none', stroke: color, 'stroke-width': 5 });
    const pedal = addPath(group, { stroke: '#293f41', 'stroke-width': 6 });
    const foot = addPath(group, { fill: color, stroke: '#453e39', 'stroke-width': 2.2 });
    return { crank, outline, skin, pedal, foot };
  }

  // 两只脚始终相隔半圈。由脚踏反推膝关节，让脚蹼紧贴踏板。
  function poseLeg(leg, phase, bob) {
    const x = 440 + 20 * Math.cos(phase);
    const y = 398 + 20 * Math.sin(phase);
    const ankleX = x - 8, ankleY = y - 8;
    const hipX = 425, hipY = 309 + bob;
    const dx = ankleX - hipX, dy = ankleY - hipY;
    const span = Math.hypot(dx, dy);
    const bend = Math.sqrt(Math.max(0, 57 ** 2 - (span / 2) ** 2));
    const kneeX = hipX + dx / 2 + dy / span * bend;
    const kneeY = hipY + dy / 2 - dx / span * bend;
    const shape = 'M' + hipX + ' ' + hipY + ' L' + kneeX + ' ' + kneeY + ' L' + ankleX + ' ' + ankleY;
    leg.outline.setAttribute('d', shape);
    leg.skin.setAttribute('d', shape);
    leg.crank.setAttribute('d', 'M440 398L' + x + ' ' + y);
    leg.pedal.setAttribute('d', 'M' + (x - 10) + ' ' + y + 'h22');
    leg.foot.setAttribute('d', 'M' + ankleX + ' ' + (ankleY - 2) + 'q7 5 17 5l4 3-7 0-4 1-7-1q-7-1-3-8Z');
  }

  const near = makeLeg('near-leg', '#edaa53');
  const far = makeLeg('far-leg', '#c98a4d');
  const rear = byId('rear-wheel'), front = byId('front-wheel');
  const road = byId('moving-road'), rider = byId('rider');
  let elapsed = 0, previous = null, frame = 0, speed = 1;
  let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw() {
    const phase = elapsed * Math.PI * 2 / 1.65;
    const bob = -1.8 * Math.sin(phase) ** 2;
    const distance = elapsed * 174;
    const rotation = 'rotate(' + distance / 60 * 180 / Math.PI + ')';
    rear.setAttribute('transform', rotation);
    front.setAttribute('transform', rotation);
    road.setAttribute('transform', 'translate(' + -(distance % 250) + ' 0)');
    rider.setAttribute('transform', 'translate(0 ' + bob + ')');
    poseLeg(near, phase, bob);
    poseLeg(far, phase + Math.PI, bob);
    scene.setCurrentTime(elapsed);
  }

  function tick(now) {
    if (previous !== null) elapsed += Math.min((now - previous) / 1000, .1) * speed;
    previous = now;
    draw();
    frame = requestAnimationFrame(tick);
  }

  function updatePlayback() {
    cancelAnimationFrame(frame);
    previous = null;
    byId('play-text').textContent = playing ? '暂停' : '播放';
    byId('play-icon').textContent = playing ? 'Ⅱ' : '▶';
    if (playing) frame = requestAnimationFrame(tick);
  }
  byId('toggle').onclick = () => { playing = !playing; updatePlayback(); };
  byId('restart').onclick = () => { elapsed = 0; playing = true; draw(); updatePlayback(); };
  byId('speed').onchange = event => { speed = Number(event.target.value); };
  byId('download').onclick = () => {
    const url = URL.createObjectURL(new Blob([source], { type: 'text/html;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'pelican-ride.html';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  draw();
  updatePlayback();
</script>
</body>
