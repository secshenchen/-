<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的海岸骑行 · SVG 动画</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f3f0e8;
    color: #254b4a;
    font-family:
      system-ui, -apple-system, "Segoe UI",
      "Microsoft YaHei", sans-serif;
  }

  main {
    width: min(100%, 1000px);
    overflow: hidden;
    background: #fffdf7;
    border: 1px solid #d8dfd3;
    border-radius: 24px;
    box-shadow: 0 18px 60px #254b4a12;
  }

  header {
    padding: 26px 30px 20px;
  }

  .eyebrow {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #68847a;
  }

  h1 {
    margin: 0;
    font-size: clamp(23px, 4vw, 34px);
    letter-spacing: 1px;
  }

  .subtitle {
    margin: 9px 0 0;
    color: #68847a;
    font-size: 14px;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    padding: 20px 30px;
  }

  button {
    min-height: 44px;
    padding: 10px 18px;
    border: 1px solid #c8d8ce;
    border-radius: 12px;
    background: transparent;
    color: #254b4a;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }

  #toggle {
    background: #285a51;
    border-color: #285a51;
    color: white;
    min-width: 108px;
  }

  button:hover {
    filter: brightness(.95);
  }

  button:focus-visible,
  input:focus-visible {
    outline: 3px solid #dd8947;
    outline-offset: 4px;
  }

  label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    margin-left: auto;
  }

  input {
    width: 130px;
    accent-color: #285a51;
  }

  output {
    min-width: 3em;
    font-variant-numeric: tabular-nums;
  }

  .hint {
    margin: 0;
    padding: 0 30px 20px;
    font-size: 12px;
    color: #71847a;
  }

  @media (max-width: 560px) {
    body {
      padding: 12px;
    }

    header,
    .controls {
      padding: 20px;
    }

    main {
      border-radius: 18px;
    }

    label {
      margin-left: 0;
      width: 100%;
    }

    input {
      flex: 1;
    }

    .hint {
      padding: 0 20px 20px;
    }
  }
</style>
</head>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const ids = [
    "bird", "eye", "scarf",
    "rearSpokes", "frontSpokes",
    "clouds", "gulls", "grasses",
    "waves", "road", "wind", "shadow",
    "farLeg", "nearLeg",
    "farFoot", "nearFoot",
    "farCrank", "nearCrank",
    "farPedal", "nearPedal"
  ];

  const el = Object.fromEntries(
    ids.map(id => [id, $(id)])
  );

  const toggle = $("toggle");
  const speed = $("speed");

  const reducedMotion = matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  const TAU = Math.PI * 2;

  // 系统开启“减少动态效果”时，默认暂停，可手动播放。
  let paused = reducedMotion.matches;
  let time = 0;
  let previous = null;
  let frameId = 0;

  function set(id, attribute, value) {
    el[id].setAttribute(attribute, value);
  }

  /*
   * 两段式腿部逆向运动学：
   * 已知髋部与脚的位置，计算膝盖位置，
   * 保持大腿、小腿长度稳定。
   */
  function drawLeg(side, angle, bob) {
    // 脚踏围绕中轴做圆周运动。
    const x = 504 + Math.cos(angle) * 33;
    const y = 475 + Math.sin(angle) * 33;

    const hipX = side === "near" ? 485 : 479;
    const hipY = 353 + bob;

    const dx = x - hipX;
    const dy = y - 7 - hipY;
    const distance = Math.hypot(dx, dy);

    const upper = 86;
    const lower = 88;

    const along = (
      upper * upper -
      lower * lower +
      distance * distance
    ) / (2 * distance);

    const height = Math.sqrt(
      Math.max(0, upper * upper - along * along)
    );

    const kneeX =
      hipX +
      along * dx / distance +
      height * dy / distance;

    const kneeY =
      hipY +
      along * dy / distance -
      height * dx / distance;

    set(
      side + "Leg",
      "d",
      `M${hipX} ${hipY} L${kneeX} ${kneeY} L${x} ${y - 7}`
    );

    set(
      side + "Foot",
      "transform",
      `translate(${x} ${y - 6})`
    );

    set(
      side + "Crank",
      "d",
      `M504 475 L${x} ${y}`
    );

    set(
      side + "Pedal",
      "d",
      `M${x - 15} ${y + 2} H${x + 16}`
    );
  }

  function render() {
    const angle = time * 2.8;
    const bob = Math.sin(angle * 2) * 2;

    // 每转一圈脚踏，轮子转 1.65 圈。
    // 路面位移与轮子转动关联。
    const wheelAngle = angle * 1.65;
    const travel = wheelAngle * 78;
    const degrees = (wheelAngle * 180 / Math.PI) % 360;

    set(
      "rearSpokes",
      "transform",
      `rotate(${degrees})`
    );

    set(
      "frontSpokes",
      "transform",
      `rotate(${degrees})`
    );

    // 身体随踩踏轻微起伏。
    set(
      "bird",
      "transform",
      `translate(0 ${bob})`
    );

    // 不同背景移动速度产生远近层次。
    set(
      "clouds",
      "transform",
      `translate(${-((travel * .08) % 1200)} 0)`
    );

    set(
      "grasses",
      "transform",
      `translate(${-(travel % 1200)} 0)`
    );

    set(
      "road",
      "patternTransform",
      `translate(${-(travel % 160)} 0)`
    );

    set(
      "waves",
      "patternTransform",
      `translate(${-((travel * .18) % 160)} 0)`
    );

    set(
      "gulls",
      "transform",
      `translate(${Math.sin(time * .4) * 12} ${Math.sin(time) * 5})`
    );

    set(
      "scarf",
      "transform",
      `rotate(${Math.sin(angle * 2.3) * 5} 510 289)`
    );

    set(
      "wind",
      "transform",
      `translate(${-Math.sin(angle) * 9} 0)`
    );

    set("shadow", "rx", 244 + bob * 2);

    // 每隔一段时间眨眼。
    const blinkPhase = time % 4.8;

    const blink = blinkPhase > 4.56
      ? 1 - .94 * Math.sin(
          (blinkPhase - 4.56) / .24 * Math.PI
        )
      : 1;

    set(
      "eye",
      "transform",
      `translate(586 180) scale(1 ${blink})`
    );

    // 两只脚相差半圈。
    drawLeg("far", (angle + Math.PI) % TAU, bob);
    drawLeg("near", angle % TAU, bob);
  }

  function animate(now) {
    frameId = 0;

    if (paused || document.hidden) {
      return;
    }

    if (previous !== null) {
      // 限制单帧时间增量，避免切换页面后突然跳跃。
      const delta = Math.min(
        (now - previous) / 1000,
        .05
      );

      time += delta * Number(speed.value);
    }

    previous = now;
    render();

    frameId = requestAnimationFrame(animate);
  }

  function updatePlayback() {
    cancelAnimationFrame(frameId);

    frameId = 0;
    previous = null;

    toggle.textContent = paused
      ? "播放动画"
      : "暂停动画";

    toggle.setAttribute(
      "aria-pressed",
      String(paused)
    );

    if (!paused && !document.hidden) {
      frameId = requestAnimationFrame(animate);
    }
  }

  toggle.addEventListener("click", () => {
    paused = !paused;
    updatePlayback();
  });

  $("reset").addEventListener("click", () => {
    time = 0;
    render();
    updatePlayback();
  });

  speed.addEventListener("input", () => {
    $("speedValue").textContent = speed.value + "×";
  });

  // 页面进入后台时暂停计算，回来后平滑继续。
  document.addEventListener(
    "visibilitychange",
    updatePlayback
  );

  document.addEventListener("keydown", event => {
    const editingControl =
      /INPUT|BUTTON|TEXTAREA|SELECT/.test(
        event.target.tagName
      );

    if (
      event.code === "Space" &&
      !event.repeat &&
      !editingControl
    ) {
      event.preventDefault();
      paused = !paused;
      updatePlayback();
    }
  });

  render();
  updatePlayback();
})();
</script>
</body>
</html>
