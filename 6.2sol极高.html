<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f5eb">
  <title>鹈鹕骑行记</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #243e39;
      background: #f9f5eb;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1060px, calc(100% - 48px)); margin: 0 auto; padding: 42px 0 32px; }
    header { margin-bottom: 26px; }
    .medium {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #47645a;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      margin: 0 0 9px;
    }
    .medium svg { color: #a34634; }
    h1 {
      font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      font-size: clamp(2rem, 4vw, 3.55rem);
      line-height: 1.15;
      letter-spacing: .055em;
      margin: 0;
    }

    figure {
      margin: 0;
      border: 1px solid #ded1bb;
      border-radius: 19px;
      overflow: hidden;
      background: #fffaf0;
      box-shadow: 0 12px 36px #553b2420;
    }
    .scene {
      display: block;
      width: 100%;
      aspect-ratio: 1120 / 620;
      background: #f8ddab;
    }
    figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 66px;
      padding: 12px 18px;
      border-top: 1px solid #ded1bb;
    }
    .controls, .speed { display: flex; align-items: center; gap: 8px; }
    .speed { gap: 4px; border: 1px solid #e0d4be; border-radius: 9px; padding: 3px; }
    button, .download {
      font: inherit;
      font-weight: 650;
      font-size: 13px;
      border-radius: 8px;
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
    }
    button:focus-visible, .download:focus-visible { outline: 2px solid #a34634; outline-offset: 3px; }
    #playback, .download {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    #playback { background: #26463f; color: #fffaf0; border: 1px solid #26463f; }
    #playback:hover { background: #365950; }
    .speed button { border: 0; color: #47645a; background: transparent; min-height: 28px; padding: 0 9px; }
    .speed button:hover, .speed button[aria-pressed="true"] { background: #eaeeda; color: #26463f; }
    .download { color: #365950; text-decoration: none; padding-inline: 8px; }
    .download:hover { text-decoration: underline; text-underline-offset: 4px; }

    @media (max-width: 620px) {
      main { width: calc(100% - 28px); padding: 27px 0 22px; }
      header { margin-bottom: 18px; }
      figure { border-radius: 14px; }
      .scene { aspect-ratio: 1 / 1; }
      figcaption { padding: 10px; }
    }

    @media (max-width: 370px) {
      .speed button { padding-inline: 6px; }
      #playback { padding-inline: 8px; }
      figcaption { column-gap: 4px; }
    }
  </style>
</head>

        hipX: 529, hipY: 322, upperLength: 78, lowerLength: 87,
        paths: [byId("near-leg-outline"), byId("near-leg")],
        pedal: byId("near-pedal"),
      };
      const far = {
        hipX: 511, hipY: 322, upperLength: 79, lowerLength: 88,
        paths: [byId("far-leg-outline"), byId("far-leg")],
        pedal: byId("far-pedal"),
      };

      const tau = 2 * Math.PI;
      const crankInterval = 1.35;
      const crankRadius = 25;
      const wheelRadius = 77;
      const gearRatio = 1.38;
      let elapsed = 0;
      let previous = 0;
      let request = 0;
      let running = false;
      let speed = 1;

      // 用两段固定长度的腿求出膝盖位置，脚始终踩在踏板上。
      function placeLeg(leg, angle, bob) {
        const footX = 544 + Math.cos(angle) * crankRadius;
        const footY = 457 + Math.sin(angle) * crankRadius;
        const hipY = leg.hipY + bob;
        const dx = footX - leg.hipX;
        const dy = footY - hipY;
        const distance = Math.hypot(dx, dy);
        const along = (leg.upperLength ** 2 - leg.lowerLength ** 2 + distance ** 2) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, leg.upperLength ** 2 - along ** 2));
        const kneeX = leg.hipX + (dx * along + dy * bend) / distance;
        const kneeY = hipY + (dy * along - dx * bend) / distance;
        const path = `M${leg.hipX} ${hipY} L${kneeX} ${kneeY} L${footX} ${footY}`;

        leg.paths.forEach((element) => element.setAttribute("d", path));
        leg.pedal.setAttribute("transform", `translate(${footX} ${footY})`);
      }

      function draw(time) {
        const turns = time / crankInterval;
        const angle = (turns % 1) * tau;
        const wheelTurns = turns * gearRatio;
        const wheelAngle = (wheelTurns % 1) * 360;
        const distance = wheelTurns * tau * wheelRadius;
        const bob = Math.sin(2 * angle) * 2.2;
        const flutter = Math.sin(time * 9) * 7 + Math.sin(time * 16) * 2;
        const blink = Math.max(0, 1 - Math.abs((time % 5.3) - 4.7) / 0.095);

        [rearWheel, frontWheel].forEach((wheel) => wheel.setAttribute("transform", `rotate(${wheelAngle})`));
        crank.setAttribute("transform", `rotate(${angle * 180 / Math.PI})`);
        road.setAttribute("transform", `translate(${-(distance % 200)} 0)`);
        bricks.setAttribute("transform", `translate(${-((distance * 0.55) % 180)} 0)`);
        ripples.setAttribute("transform", `translate(${-((distance * 0.09) % 240)} 0)`);
        clouds.setAttribute("transform", `translate(${Math.sin(time * 0.31) * 14} 0)`);

        placeLeg(near, angle, bob);
        placeLeg(far, angle + Math.PI, bob);
        pelican.setAttribute("transform", `translate(0 ${bob})`);
        scarf.setAttribute("d", `M561 220C534 217 505 ${214 + flutter} 480 ${226 + flutter}
          l16 3-8 11C519 ${236 + flutter / 2} 534 234 560 234Z`);
        eye.setAttribute("transform", `translate(0 172) scale(1 ${1 - blink * 0.91}) translate(0 -172)`);

        // 翅膀随身体起伏，翼尖以车把上的握点为轴。
        const wingAngle = -bob * 0.4;
        const wingRotation = `rotate(${wingAngle} 652 284)`;
        wing.setAttribute("transform", wingRotation);
        wingFeathers.setAttribute("transform", wingRotation);
      }

      function frame(now) {
        elapsed += Math.min((now - previous) / 1000, 0.05) * speed;
        previous = now;
        draw(elapsed);
        request = requestAnimationFrame(frame);
      }

      function setPlaying(playing) {
        if (playing === running) return;
        running = playing;
        if (playing) {
          previous = performance.now();
          request = requestAnimationFrame(frame);
        } else {
          cancelAnimationFrame(request);
        }
        playbackLabel.textContent = playing ? "暂停" : "播放";
        playbackIcon.setAttribute("d", playing ? "M4 3h2.5v10H4zM9.5 3H12v10H9.5z" : "M5 2.5 13 8l-8 5.5z");
      }

      playback.addEventListener("click", () => setPlaying(!running));
      speedButtons.forEach((button) => {
        button.addEventListener("click", () => {
          speed = Number(button.dataset.speed);
          speedButtons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        });
      });
      reducedMotion.addEventListener("change", (event) => {
        if (event.matches) setPlaying(false);
      });

      draw(0);
      if (!reducedMotion.matches) setPlaying(true);
    })();
  </script>
</body>
</html>
